<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tickets.Now — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='tickets.css') }}" />
</head>
<body>
  <div id="loading" class="loading"><div class="loading-box">Loading…<div class="barline"><span></span></div></div></div>

  <header class="site-nav">
    <a class="site-nav__brand" href="/">
      <span class="site-nav__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v1H2V9z"/><path d="M2 11h20v2a3 3 0 0 1-3 3v4a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-4a3 3 0 0 1-3-3v-2z"/></svg>
      </span>
      Tickets.Now
    </a>
    <nav class="site-nav__links">
      <a href="/">Home</a>
    </nav>
  </header>

  <div class="page-wrap" style="padding-top: 12px;">
    {% if msg %}<div class="msg-banner {% if 'Invalid' in msg or 'already' in msg or 'Fill' in msg %}msg-banner--warn{% endif %}" style="max-width:440px;margin-left:auto;margin-right:auto;">{{ msg }}</div>{% endif %}

    <div class="auth-grid">
      <form class="auth-card" method="post" action="/login" autocomplete="on">
        <h2>Log in</h2>
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="login-pass">Password</label>
          <input id="login-pass" name="password" type="password" placeholder="••••••••" required />
        </div>
        <button type="submit">Log in</button>
      </form>

      <form class="auth-card" method="post" action="/signup" autocomplete="on">
        <h2>Create account</h2>
        <div class="field">
          <label for="su-name">Name</label>
          <input id="su-name" name="name" type="text" placeholder="Your name" required />
        </div>
        <div class="field">
          <label for="su-email">Email</label>
          <input id="su-email" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="su-pass">Password</label>
          <input id="su-pass" name="password" type="password" placeholder="Choose a password" required />
        </div>
        <button type="submit">Create account</button>
      </form>
    </div>
  </div>

  <script>
    const loader = document.getElementById("loading");
    const show = () => { loader.style.display = "flex"; };
    document.querySelectorAll("a[href]").forEach(a => a.addEventListener("click", show));
    document.querySelectorAll("form").forEach(f => f.addEventListener("submit", show));
  </script>
</body>
</html>
