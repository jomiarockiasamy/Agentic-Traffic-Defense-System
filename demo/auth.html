<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #222; }
    .bar { position: relative; padding: 12px 16px; background: #111; color: #fff; min-height: 22px; }
    .left { display: flex; gap: 12px; }
    .bar a { color: #fff; text-decoration: none; }
    .center { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 700; }
    .wrap { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    input, button { width: 100%; padding: 9px; margin-top: 8px; box-sizing: border-box; }
    button { background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .msg { margin: 8px 0 12px; color: #0a5; font-size: 14px; }
    .loading { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 9999; }
    .loading-box { background: #fff; padding: 14px; border-radius: 8px; width: 280px; text-align: center; }
    .barline { height: 8px; background: #eee; border-radius: 99px; overflow: hidden; margin-top: 8px; }
    .barline span { display: block; height: 100%; width: 45%; background: #111; animation: slide 1s infinite; }
    @keyframes slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(300%);} }
  </style>
</head>
<body>
  <div id="loading" class="loading"><div class="loading-box">Loading...<div class="barline"><span></span></div></div></div>
  <div class="bar">
    <div class="left"><a href="/">Home</a></div>
    <div class="center">Website</div>
  </div>
  <div class="wrap">
    {% if msg %}<p class="msg">{{ msg }}</p>{% endif %}
    <form class="card" method="post" action="/login">
      <h3>Login</h3>
      <input name="email" type="email" placeholder="Email" required />
      <input name="password" type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <form class="card" method="post" action="/signup">
      <h3>Sign Up</h3>
      <input name="name" type="text" placeholder="Name" required />
      <input name="email" type="email" placeholder="Email" required />
      <input name="password" type="password" placeholder="Password" required />
      <button type="submit">Create Account</button>
    </form>
  </div>
  <script>
    const loader = document.getElementById("loading");
    const show = () => loader.style.display = "flex";
    document.querySelectorAll("a").forEach(a => a.addEventListener("click", show));
    document.querySelectorAll("form").forEach(f => f.addEventListener("submit", show));
  </script>
</body>
</html>
